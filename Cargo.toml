[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
sunbliss-core = { path = "crates/core" }

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

[profile.shell]
inherits = "release"
