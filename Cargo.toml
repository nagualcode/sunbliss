[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/plugin"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
sunbliss-core = { path = "crates/core" }
truce = { version = "6.3" }
truce-core = { version = "6.3" }
truce-params = { version = "6.3" }
truce-egui = { version = "6.3" }
truce-font = { version = "6.3" }
truce-clap = { version = "6.3" }
truce-vst3 = { version = "6.3" }
truce-au = { version = "6.3" }
truce-test = { version = "6.3" }

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

[profile.shell]
inherits = "release"
